server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas servir les fichiers de déploiement embarqués
    location ^~ /_deploy/ {
        deny all;
        return 404;
    }

    error_page 403 /__cobea_403.html;
    location = /__cobea_403.html {
        default_type text/plain;
        return 403 "Cobea: frontend/ vide ou illisible. Sur le PC: npm run prepare:nas puis copie frontend/ → /Volume1/Docker/cobea/frontend/ (index.html à la racine).\n";
    }

    location /api/ {
        proxy_pass http://cobea-api:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
