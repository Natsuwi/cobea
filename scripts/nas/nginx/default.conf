server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas servir les fichiers de déploiement embarqués
    location ^~ /_deploy/ {
        deny all;
        return 404;
    }

    error_page 403 /__cobea_403.html;
    location = /__cobea_403.html {
        default_type text/plain;
        charset utf-8;
        return 403 "Cobea: frontend illisible (permissions). Sur le NAS, verifie que /Volume1/Docker/cobea/frontend/index.html existe, puis Restart cobea-frontend. Sur le PC: npm run prepare:nas puis re-copie frontend/.\n";
    }

    location /api/ {
        proxy_pass http://cobea-api:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    # Web Share Target POST — must not hit static try_files (405)
    location = /share-target {
        proxy_pass http://cobea-api:3847/api/share-target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Workbox precache manifest + helpers — short cache so updates propagate
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
