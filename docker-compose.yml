# Coller ce YAML dans TerraMaster Docker Manager.
# Sur le disque NAS, uniquement :
#   /Volume1/Docker/cobea/frontend/
#   /Volume1/Docker/cobea/backend/
#
# PC: npm run prepare:nas → copie les 2 dossiers → Restart

services:
  cobea-api:
    image: node:22-alpine
    container_name: cobea-api
    working_dir: /app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cobea:Drx2OtnGv%249Ed%2A@shared-postgres:5432/cobea_db
      PORT: 3847
      STORAGE_MODE: standard
      CORS_ORIGIN: https://cobea.tnas-movies.ddns.net
      PUBLIC_API_URL: ""
      JWT_SECRET: ee4a43e1de3b3562c42711f757b0c0ed1a461c6ce775b740a7242b56aa09f447
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: https://cobea.tnas-movies.ddns.net/api/auth/google/callback
    ports:
      - "3847:3847"
    volumes:
      - /Volume1/Docker/cobea/backend:/app
      - cobea_api_node_modules:/app/node_modules
    command: ["sh", "/app/docker-entrypoint.sh"]
    networks:
      - postgres-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cobea-frontend:
    image: nginx:alpine
    container_name: cobea-frontend
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8083:80"
    volumes:
      # writable : permet de corriger un mauvais nestage / page diagnostic
      - /Volume1/Docker/cobea/frontend:/usr/share/nginx/html
    command: ["sh", "/usr/share/nginx/html/_deploy/entrypoint.sh"]
    networks:
      - postgres-net
    depends_on:
      - cobea-api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cobea_api_node_modules:

networks:
  postgres-net:
    external: true
